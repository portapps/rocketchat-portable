name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Rocket.Chat
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const upstream = { owner: 'RocketChat', repo: 'Rocket.Chat.Electron' };
            const versionPattern = /^\d+\.\d+\.\d+$/;

            function compareVersions(left, right) {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                const difference = leftParts[i] - rightParts[i];
                if (difference !== 0) {
                  return difference;
                }
              }
              return 0;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...upstream,
              per_page: 100
            });
            const candidates = releases.filter(release =>
              !release.draft &&
              !release.prerelease &&
              versionPattern.test(release.tag_name) &&
              release.assets.some(asset => asset.name === `rocketchat-${release.tag_name}-win-x64.exe`)
            );
            if (candidates.length === 0) {
              throw new Error('No stable Rocket.Chat Windows x64 installer found');
            }
            candidates.sort((left, right) => compareVersions(left.tag_name, right.tag_name));
            const latest = candidates.at(-1);
            core.info(`Latest stable Rocket.Chat Windows x64 installer: ${latest.tag_name}`);

            const propertiesPath = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const properties = fs.readFileSync(propertiesPath, 'utf8');
            const versionMatch = properties.match(/^app\.version[ \t]*=[ \t]*(\S+)[ \t]*$/m);
            const releaseMatch = properties.match(/^app\.release[ \t]*=[ \t]*(\d+)[ \t]*$/m);
            if (!versionMatch || !versionPattern.test(versionMatch[1]) || !releaseMatch) {
              throw new Error('Invalid app.version or app.release in build.properties');
            }

            const currentVersion = versionMatch[1];
            if (compareVersions(latest.tag_name, currentVersion) <= 0) {
              core.info(`Already at Rocket.Chat ${currentVersion} or newer`);
            } else {
              const updated = properties
                .replace(/^app\.version([ \t]*=[ \t]*)\S+/m, (_, assignment) => `app.version${assignment}${latest.tag_name}`)
                .replace(/^app\.release([ \t]*=[ \t]*)\d+/m, (_, assignment) => `app.release${assignment}${Number(releaseMatch[1]) + 1}`);
              fs.writeFileSync(propertiesPath, updated, 'utf8');
              core.info(`Updated build.properties from ${currentVersion} to ${latest.tag_name}`);
            }

            core.setOutput('title', `Rocket.Chat ${latest.tag_name}`);
            core.setOutput('version', latest.tag_name);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-rocketchat
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates Rocket.Chat to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Rocket.Chat
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
